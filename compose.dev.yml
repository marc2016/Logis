# Entwicklung: nur die Datenbank. Backend und Frontend laufen lokal
# (./mvnw spring-boot:run -Dspring-boot.run.profiles=dev / npm run dev).
name: logis-dev

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: logis
      POSTGRES_USER: logis
      POSTGRES_PASSWORD: logis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logis -d logis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata-dev:
