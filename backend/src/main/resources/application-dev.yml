# Local development against compose.dev.yml - NOT for production.
spring:
  datasource:
    password: logis

logis:
  # Test accounts and data for an empty development database (relative to backend/, see dev/README.md).
  dev:
    seed-file: ../dev/seed.sql
  admin:
    username: admin
    password: admin-dev-password
  # Fixed dev key (32 bytes, Base64)
  encryption-key: ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=
  auth:
    # Sign-in with password only, without TOTP; refused outside the dev profile (DevTotpBypassGuard).
    dev-totp-bypass: true
    # Passkeys against the Vite dev server.
    public-url: http://localhost:5173
    lockout:
      base-duration: 5s
      max-duration: 30s

# Management/health locally on a free random port (8081 is often taken; Docker uses 8081 in the container).
management:
  server:
    port: 0
