spring:
  application:
    name: logis
  servlet:
    multipart:
      # Documents: at most 10 MB per file (checked again in DocumentService).
      max-file-size: 10MB
      max-request-size: 11MB
  modulith:
    detection-strategy: explicitly-annotated
  datasource:
    url: ${LOGIS_DB_URL:jdbc:postgresql://localhost:5432/logis}
    username: ${LOGIS_DB_USER:logis}
    password: ${LOGIS_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # One schema per area; migrations of all modules always run (including disabled ones).
    schemas: core,vacationrental,longtermrental
    default-schema: core
    locations:
      - classpath:db/migration/core
      - classpath:db/migration/vacationrental
      - classpath:db/migration/longtermrental

server:
  port: 8080
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        name: LOGIS_SESSION
        http-only: true
        same-site: lax

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logis:
  # Optional AI fallback for mails no rule recognises (sends mail text including guest data to Anthropic).
  ai:
    enabled: ${LOGIS_AI_ENABLED:false}
    api-key: ${LOGIS_ANTHROPIC_API_KEY:}
    model: ${LOGIS_AI_MODEL:claude-opus-5-5}
  admin:
    username: ${LOGIS_ADMIN_USERNAME:}
    password: ${LOGIS_ADMIN_PASSWORD:}
  encryption-key: ${LOGIS_ENCRYPTION_KEY:}
  # Notifications through Pushover; the application token and the users' keys are set in the app. The address only
  # changes for tests, which point it at a stand-in.
  pushover:
    base-url: ${LOGIS_PUSHOVER_BASE_URL:https://api.pushover.net}
  # Local GeoIP database (DB-IP Lite) for the location of sign-ins; downloaded monthly, never queried remotely.
  geoip:
    enabled: ${LOGIS_GEOIP_ENABLED:true}
    directory: ${LOGIS_GEOIP_DIRECTORY:/var/lib/logis/geoip}
  auth:
    # Address users open Logis under (e.g. https://logis.example.org); passkeys are bound to it. Empty: no passkeys.
    public-url: ${LOGIS_PUBLIC_URL:}
    session:
      idle-timeout: 30m
      absolute-timeout: 12h
    # "Angemeldet bleiben": forgotten after this long without use, and at the latest this long after the sign-in.
    remember-me:
      sliding: 30d
      absolute: 90d
      reuse-grace: 1m
    lockout:
      threshold: 5
      base-duration: 1m
      max-duration: 15m
