spring:
  datasource:
    hikari:
      # Many cached test contexts share one Postgres (max 100 connections).
      maximum-pool-size: 4
      minimum-idle: 0
  flyway:
    locations:
      - classpath:db/migration/core
      - classpath:db/migration/vacationrental
      - classpath:db/testmigration

management:
  server:
    port: -1

logis:
  # Tests trigger mail polling themselves.
  mailimport:
    polling: false
  admin:
    username: bootstrap-admin
    password: bootstrap-admin-password
  encryption-key: dGVzdC1rZXktMzItYnl0ZXMtbG9uZy0xMjM0NTY3OCE=
