# Logis - the only entry point. The upstream reverse proxy terminates TLS.

server_tokens off;

# Rate limit for the sign-in steps, key = real client IP (see 00-real-ip.conf).
limit_req_zone $binary_remote_addr zone=logis_auth:10m rate=10r/m;
limit_req_status 429;

# Take the protocol from the reverse proxy, otherwise our own.
map $http_x_forwarded_proto $logis_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 25m;

    # Applies to all responses. Locations must not set their own add_header,
    # otherwise these headers are lost there.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $logis_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header X-Powered-By;
    # Only nginx sets security headers (above) - duplicate headers would be invalid for browsers.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Strict-Transport-Security;

    location ~ ^/api/auth/(login|totp|password) {
        limit_req zone=logis_auth burst=5 nodelay;
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: unknown paths serve index.html (deep links). /actuator is never forwarded.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
