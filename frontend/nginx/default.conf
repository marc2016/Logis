# Logis - einziger Einstiegspunkt. TLS terminiert der vorgelagerte Reverse Proxy.

server_tokens off;

# Rate-Limit fuer die Anmeldeschritte, Schluessel = echte Client-IP (siehe 00-real-ip.conf).
limit_req_zone $binary_remote_addr zone=logis_auth:10m rate=10r/m;
limit_req_status 429;

# Protokoll vom Reverse Proxy uebernehmen, sonst das eigene.
map $http_x_forwarded_proto $logis_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 25m;

    # Gilt fuer alle Antworten. Locations duerfen kein eigenes add_header setzen,
    # sonst gehen diese Header dort verloren.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $logis_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header X-Powered-By;
    # Security-Header setzt ausschliesslich nginx (oben) - doppelte Header waeren fuer Browser ungueltig.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Strict-Transport-Security;

    location ~ ^/api/auth/(login|totp|password) {
        limit_req zone=logis_auth burst=5 nodelay;
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: unbekannte Pfade liefern index.html (Deep Links). /actuator wird nie weitergeleitet.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
