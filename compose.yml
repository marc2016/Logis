# Logis - production (mini PC behind an existing reverse proxy).
# Start: docker compose pull && docker compose up -d   (settings from .env, template: .env.example)
# Images: ghcr.io/marc2016/logis-*, tag from LOGIS_VERSION. Build locally instead: docker compose up -d --build
name: logis

services:
  frontend:
    build: ./frontend
    image: ghcr.io/marc2016/logis-frontend:${LOGIS_VERSION:-latest}
    restart: unless-stopped
    environment:
      LOGIS_TRUSTED_PROXIES: ${LOGIS_TRUSTED_PROXIES:-}
    ports:
      # The only published port. Default: local only, for the reverse proxy.
      - "${LOGIS_BIND:-127.0.0.1}:${LOGIS_PORT:-8080}:80"
    networks: [edge, internal]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build: ./backend
    image: ghcr.io/marc2016/logis-backend:${LOGIS_VERSION:-latest}
    restart: unless-stopped
    environment:
      LOGIS_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is missing}
      LOGIS_DB_USER: ${POSTGRES_USER:?POSTGRES_USER is missing}
      LOGIS_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing}
      LOGIS_ADMIN_USERNAME: ${LOGIS_ADMIN_USERNAME:-}
      LOGIS_ADMIN_PASSWORD: ${LOGIS_ADMIN_PASSWORD:-}
      LOGIS_ENCRYPTION_KEY: ${LOGIS_ENCRYPTION_KEY:?LOGIS_ENCRYPTION_KEY is missing}
      LOGIS_MODULES_VACATIONRENTAL_ENABLED: ${LOGIS_MODULES_VACATIONRENTAL_ENABLED:-true}
      LOGIS_AI_ENABLED: ${LOGIS_AI_ENABLED:-false}
      LOGIS_ANTHROPIC_API_KEY: ${LOGIS_ANTHROPIC_API_KEY:-}
      LOGIS_AI_MODEL: ${LOGIS_AI_MODEL:-claude-opus-5-5}
    # egress: outbound only (mail import via IMAP, optional AI); no published ports.
    networks: [internal, egress]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    # Same image as the database, so that pg_dump matches the server version.
    image: postgres:17
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./ops/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

networks:
  # Only frontend is attached here; the published port runs through it.
  edge: {}
  # No outside connection: db and backup are reachable internally only; the backend also uses egress.
  internal:
    internal: true
  # Outbound connections of the backend only (IMAP, optional Claude API). Nothing is published on it.
  egress: {}

volumes:
  pgdata:
