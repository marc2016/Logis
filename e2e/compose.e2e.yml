# Override for the end-to-end tests: a test mail server next to the stack from compose.yml.
# The backend reaches it as "greenmail" (IMAP 3143, no TLS); the tests deliver mails via SMTP on 127.0.0.1:3025.
services:
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports:
      - "127.0.0.1:3025:3025"
    networks: [egress]
